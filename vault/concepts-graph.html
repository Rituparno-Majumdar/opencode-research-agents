<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concepts Graph View</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #graph {
      width: 100vw;
      height: 100vh;
    }
    .node circle {
      stroke: #fff;
      stroke-width: 2px;
      cursor: pointer;
      transition: r 0.2s ease;
    }
    .node:hover circle { r: 12; }
    .node text {
      fill: #e0e0e0;
      font-size: 11px;
      pointer-events: none;
      text-anchor: middle;
      dy: 20px;
    }
    .link {
      stroke: #404040;
      stroke-opacity: 0.6;
      stroke-width: 1.5px;
    }
    .tooltip {
      position: absolute;
      background: #2d2d2d;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      border: 1px solid #404040;
      max-width: 250px;
    }
    #header {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      color: #e0e0e0;
    }
    #header h1 { font-size: 18px; font-weight: 600; }
    #header p { font-size: 12px; color: #888; margin-top: 4px; }
    #count {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Concepts Graph</h1>
    <p>Atomic notes concepts only</p>
  </div>
  <div id="count"></div>
  <div id="graph"></div>
  <div class="tooltip" id="tooltip"></div>

  <script>
    const conceptsPath = 'atomic-notes/concepts/';
    const width = window.innerWidth;
    const height = window.innerHeight;

    async function loadConcepts() {
      const nodes = [];
      const links = [];
      const nodeSet = new Set();

      // In Obsidian, you'd use the API. Here we simulate with sample data
      // Replace this with actual file reading in your context

      const sampleConcepts = [
        { title: 'karma', content: 'Action and its consequences in ethical cycles' },
        { title: 'samsara', content: 'Cycle of birth, death, rebirth' },
        { title: 'moksha', content: 'Liberation from the cycle of rebirth' },
        { title: 'atman', content: 'Individual soul, eternal self' },
        { title: 'anatta', content: 'Non-self, absence of permanent identity' },
        { title: 'bardo', content: 'Intermediate state between death and rebirth' },
        { title: 'metempsychosis', content: 'Transmigration of souls' },
        { title: 'butterfly_effect', content: 'Small causes have large effects' }
      ];

      sampleConcepts.forEach(c => {
        nodes.push({ id: c.title, content: c.content });
        nodeSet.add(c.title);
      });

      // Define relationships
      const relationships = [
        { source: 'karma', target: 'samsara' },
        { source: 'samsara', target: 'moksha' },
        { source: 'atman', target: 'moksha' },
        { source: 'anatta', target: 'samsara' },
        { source: 'bardo', target: 'samsara' },
        { source: 'metempsychosis', target: 'samsara' },
        { source: 'butterfly_effect', target: 'karma' }
      ];

      relationships.forEach(r => {
        if (nodeSet.has(r.source) && nodeSet.has(r.target)) {
          links.push({ source: r.source, target: r.target });
        }
      });

      return { nodes, links };
    }

    async function render() {
      const { nodes, links } = await loadConcepts();
      document.getElementById('count').textContent = `${nodes.length} concepts`;

      const svg = d3.select('#graph')
        .append('svg')
        .attr('width', width)
        .attr('height', height);

      const simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(100))
        .force('charge', d3.forceManyBody().strength(-300))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(40));

      const link = svg.append('g')
        .selectAll('.link')
        .data(links)
        .enter().append('line')
        .attr('class', 'link');

      const node = svg.append('g')
        .selectAll('.node')
        .data(nodes)
        .enter().append('g')
        .attr('class', 'node')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));

      node.append('circle')
        .attr('r', 8)
        .attr('fill', '#539bf5');

      node.append('text')
        .text(d => d.id);

      const tooltip = document.getElementById('tooltip');

      node.on('mouseover', (e, d) => {
        tooltip.style.opacity = 1;
        tooltip.innerHTML = `<strong>${d.id}</strong><br>${d.content || ''}`;
        tooltip.style.left = e.pageX + 10 + 'px';
        tooltip.style.top = e.pageY + 10 + 'px';
      }).on('mouseout', () => {
        tooltip.style.opacity = 0;
      });

      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        node.attr('transform', d => `translate(${d.x},${d.y})`);
      });

      function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }

      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }

      function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }
    }

    render();
  </script>
</body>
</html>
