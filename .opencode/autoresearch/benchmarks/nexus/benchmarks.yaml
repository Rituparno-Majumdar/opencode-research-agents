# Nexus (Research) Benchmark Tasks
# Each task has: query, expected_sources, evaluation_criteria

benchmarks:
  - id: nexus_01
    query: "What is the capital of Australia?"
    expected_fact: "Canberra"
    evaluation:
      val_accuracy: 1.0  # Must mention Canberra, not Sydney

  - id: nexus_02
    query: "Who wrote 'Romeo and Juliet'?"
    expected_fact: "William Shakespeare"
    evaluation:
      val_accuracy: 1.0

  - id: nexus_03
    query: "What year did World War II end?"
    expected_fact: "1945"
    evaluation:
      val_accuracy: 1.0

  - id: nexus_04
    query: "What is the chemical symbol for gold?"
    expected_fact: "Au"
    evaluation:
      val_accuracy: 1.0

  - id: nexus_05
    query: "Which planet is known as the Red Planet?"
    expected_fact: "Mars"
    evaluation:
      val_accuracy: 1.0

# Simple factual queries to test source quality and accuracy
# Score = number correct / 5