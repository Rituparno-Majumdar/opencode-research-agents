# config.yaml — Central configuration. All settings live here. Never hardcode.

# Model
model: "gemini-2.5-flash"

# Token budgets per call type
max_tokens:
  source_map: 3000
  agent: 12000
  review: 4000
  ingest: 15000
  evaluate: 6000
  improve: 6000

# Temperatures
temperature:
  source_map: 0.2
  agent: 0.3
  review: 0.4
  ingest: 0.2
  evaluate: 0.1
  improve: 0.3

# Paths
obsidian_vault_path: "./vault"
agents_path: "./.agents/prompts"
memory_path: "./.memory"

# Improvement gates
min_evals_before_improve: 2
improvement_score_threshold: 0.5

# Relevance filtering
relevance_threshold: 5
relevance_budget_tiers:
  full: 12000      # agents scoring > threshold get full budget
  reduced: 4000    # agents scoring <= threshold are marked inactive

# Atomic note types
atomic_note_types:
  - concepts
  - people
  - texts
  - patterns
  - traditions
  - questions

# Boundary case routing defaults (resolved per-topic in _source_map.json)
