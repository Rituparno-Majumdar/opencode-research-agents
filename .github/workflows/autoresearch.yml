# Autoresearch - Cloud Workflow
# Runs overnight to improve all specialists autonomously

name: Autoresearch Nightly

on:
  # Run every night at 12:07 AM UTC (5:37 AM IST)
  schedule:
    - cron: '7 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      start_from:
        description: 'Start from specialist (leave empty to continue from last checkpoint)'
        required: false
        default: ''

jobs:
  autoresearch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set OpenRouter API Key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> $GITHUB_ENV

      - name: Load checkpoint
        run: |
          echo "=== Loading Checkpoint ==="
          CHECKPOINT_FILE=".opencode/autoresearch/checkpoint.json"
          if [ -f "$CHECKPOINT_FILE" ]; then
            LAST_SPECIALIST=$(python3 -c "import json; print(json.load(open('$CHECKPOINT_FILE')).get('last_specialist', ''))")
            LAST_CYCLE=$(python3 -c "import json; print(json.load(open('$CHECKPOINT_FILE')).get('last_cycle', 0))")
            echo "Resuming from: $LAST_SPECIALIST (cycle $LAST_CYCLE)"
          else
            LAST_SPECIALIST=""
            LAST_CYCLE=0
            echo "Starting fresh - no checkpoint found"
          fi
          echo "LAST_SPECIALIST=$LAST_SPECIALIST" >> $GITHUB_ENV
          echo "LAST_CYCLE=$LAST_CYCLE" >> $GITHUB_ENV

      - name: Check API quota
        run: |
          echo "=== Checking API Quota ==="
          # Read checkpoint to see how many cycles done today
          CHECKPOINT_FILE=".opencode/autoresearch/checkpoint.json"
          CYCLES_TODAY=$(python3 -c "
import json
from datetime import datetime
if '$CHECKPOINT_FILE':
    try:
        data = json.load(open('$CHECKPOINT_FILE'))
        today = datetime.now().strftime('%Y-%m-%d')
        if data.get('date') == today:
            print(data.get('cycles_today', 0))
        else:
            print(0)
    except: print(0)
else: print(0)
" 2>/dev/null || echo "0")
          echo "Cycles run today: $CYCLES_TODAY"
          
          # Max cycles per night (approximate - adjust based on API quota)
          MAX_CYCLES=20
          if [ "$CYCLES_TODAY" -ge "$MAX_CYCLES" ]; then
            echo "API quota exhausted for today. Saving checkpoint and exiting."
            python3 -c "
import json
from datetime import datetime
data = {'date': datetime.now().strftime('%Y-%m-%d'), 'cycles_today': $CYCLES_TODAY, 'last_specialist': 'exhausted', 'last_cycle': 0}
with open('.opencode/autoresearch/checkpoint.json', 'w') as f:
    json.dump(data, f)
"
            echo "checkpoint_saved=true" >> $GITHUB_ENV
            exit 0
          else
            echo "checkpoint_saved=false" >> $GITHUB_ENV
          fi

      - name: Run Autoresearch for CEO (Axiom) - First
        if: env.checkpoint_saved == 'false'
        run: |
          echo "=== Running Autoresearch for CEO (Axiom) ==="
          cd .opencode/autoresearch
          python3 -c "
import sys
import os
sys.path.insert(0, '.')
os.environ['OPENROUTER_API_KEY'] = os.environ.get('OPENROUTER_API_KEY', '')

from workflow import run_specialist_cycle, SPECIALISTS

# CEO is the coordinator - run first
result = run_specialist_cycle('ceo', 'nightly_experiment')
print(f'CEO Result: {result}')
" || echo "CEO cycle completed"

      - name: Run Autoresearch for Top 3 Specialists - Batch
        if: env.checkpoint_saved == 'false'
        run: |
          echo "=== Running Autoresearch for specialists batch ==="
          cd .opencode/autoresearch
          python3 -c "
import sys
import os
import json
sys.path.insert(0, '.')
os.environ['OPENROUTER_API_KEY'] = os.environ.get('OPENROUTER_API_KEY', '')

from workflow import run_autoresearch_for_specialists

# Check if we should skip any specialists based on checkpoint
last_spec = os.environ.get('LAST_SPECIALIST', '')
last_cycle = int(os.environ.get('LAST_CYCLE', 0))

# Determine which specialists to run
all_specialists = ['nexus', 'flux', 'vector']

if last_spec and last_spec != 'ceo':
    # Resume from where we left off
    try:
        idx = all_specialists.index(last_spec)
        to_run = all_specialists[idx:]
    except:
        to_run = all_specialists
else:
    to_run = all_specialists

print(f'Running specialists: {to_run}')

# Run the experiment cycle
run_autoresearch_for_specialists(to_run)

# Update checkpoint
from datetime import datetime
checkpoint = {
    'date': datetime.now().strftime('%Y-%m-%d'),
    'cycles_today': last_cycle + 1,
    'last_specialist': to_run[-1] if to_run else 'complete',
    'last_cycle': last_cycle + 1
}
with open('.opencode/autoresearch/checkpoint.json', 'w') as f:
    json.dump(checkpoint, f)
print('Checkpoint updated')
" || echo "Specialists batch completed"

      - name: Check results
        run: |
          echo "=== Results Summary ==="
          if [ -f .opencode/autoresearch/results.tsv ]; then
            echo "Results file exists"
            tail -10 .opencode/autoresearch/results.tsv
          else
            echo "No results yet - first run"
          fi

      - name: Show checkpoint status
        run: |
          echo "=== Checkpoint Status ==="
          if [ -f .opencode/autoresearch/checkpoint.json ]; then
            cat .opencode/autoresearch/checkpoint.json
          else
            echo "No checkpoint file"
          fi

      - name: Commit improvements
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Autoresearch: Daily improvement cycle $(date +%Y-%m-%d)"
            echo "Changes committed"
          else
            echo "No changes to commit"
          fi

      - name: Push changes
        run: |
          git push origin main || echo "No changes to push"