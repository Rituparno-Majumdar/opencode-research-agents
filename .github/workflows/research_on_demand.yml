name: Research On Demand

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Research topic (e.g. "How humans pursue death")'
        required: true
        type: string
      auto_ingest:
        description: 'Auto-run ingest after research?'
        required: false
        type: boolean
        default: false

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run research pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -c "
          import asyncio, json, re, sys
          from datetime import datetime
          sys.path.insert(0, '.')
          from utils.file_ops import load_prompt, write_vault_file, write_zettel, write_structure_note, write_register_entry
          from utils.openrouter_ops import call_async, call_parallel

          async def run(topic):
              orch = load_prompt('orchestrator')
              print(f'[Phase 1] Planning: {topic}')
              raw = await call_async(orch, f'Research topic: {topic}', 0.2, 3000)
              m = re.search(r'\{[\s\S]*\}', raw)
              sm = json.loads(m.group())
              slug = sm['slug']
              write_vault_file(slug, '_source_map.json', json.dumps(sm, indent=2))
              print(f'  Slug: {slug}')

              agents = [
                  ('agent_a_indic','indic_traditions','indic_traditions.md'),
                  ('agent_b_western','western_philosophy','western_philosophy.md'),
                  ('agent_c_civilizations','ancient_civilizations','ancient_civilizations.md'),
                  ('agent_d_contemporary','contemporary_scholarship','contemporary_scholarship.md'),
              ]
              print('[Phase 2] Dispatching 4 agents in parallel...')
              calls = []
              for pf, ak, _ in agents:
                  a = sm['agent_assignments'][ak]
                  msg = f'RESEARCH TOPIC: {sm[\"topic\"]}\nRESEARCH QUESTION: {sm[\"research_question\"]}\nYOUR SCOPE: {a[\"scope\"]}\nKNOWN SOURCES:\n' + '\n'.join(a['known_sources']) + f'\nLANGUAGES: {chr(44).join(a[\"search_languages\"])}\nSPECIAL: {a.get(\"special_instructions\",\"\")}\nTIMESTAMP: {datetime.utcnow().isoformat()}'
                  calls.append({'system': load_prompt(pf), 'user': msg, 'temperature': 0.3, 'max_tokens': 12000})
              results = await call_parallel(calls)
              for (_, _, fname), content in zip(agents, results):
                  write_vault_file(slug, fname, content)
                  print(f'  Done: {fname}')

              print('[Phase 3] Orchestrator review...')
              combined = '\n\n'.join(
                  f'FILE: {a[2]}\n' + open(f'vault/research/{slug}/{a[2]}').read()
                  for a in agents
              )
              review = await call_async(orch, f'TOPIC: {topic}\n\n{combined}', 0.4, 4000)
              write_vault_file(slug, 'orchestrator_review.md', review)
              print(f'Complete: vault/research/{slug}/')

          asyncio.run(run('${{ github.event.inputs.topic }}'))
          "

      - name: Auto ingest
        if: ${{ github.event.inputs.auto_ingest == 'true' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from utils.file_ops import get_last_slug, read_research_files, write_zettel, write_structure_note, write_register_entry
          from utils.ingest_ops import extract_zettels, validate_zettels
          from utils.memory_ops import update_domain_memory
          from datetime import datetime
          slug = get_last_slug()
          files = read_research_files(slug)
          combined = '\n\n'.join(f'FILE: {k}\n{v}' for k,v in files.items())
          result = extract_zettels(combined, slug)
          zettels = validate_zettels(result.get('zettels', []))
          written = 0
          for z in zettels:
              _, is_new = write_zettel(z['id'], z['content'])
              if is_new: written += 1
          if result.get('structure_note'):
              write_structure_note(slug, result['structure_note']['content'])
          if result.get('register_entry'):
              write_register_entry(slug, result['register_entry']['content'])
          update_domain_memory(slug, zettels)
          print(f'Ingest: {written} new Zettels from {slug}')
          print(f'Structure Note: vault/structure/{slug}.md')
          print(f'Register: vault/register/{slug}.md')
          "

      - name: Commit and push
        run: |
          git config user.name "research-bot"
          git config user.email "bot@research-system"
          git add vault/ memory/
          git diff --cached --quiet || git commit -m "research: ${{ github.event.inputs.topic }}"
          git push