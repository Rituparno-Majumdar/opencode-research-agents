# Flux (Coder) Benchmark Tasks
# Each task has: description, code_requirements, test_cases

benchmarks:
  - id: flux_01
    description: "Write a function to reverse a string"
    requirements: "function named 'reverse_string' that takes a string and returns reversed version"
    test_cases:
      - input: "hello"
        expected: "olleh"
      - input: "Python"
        expected: "nohtyP"
      - input: ""
        expected: ""

  - id: flux_02
    description: "Write a function to check if a number is prime"
    requirements: "function named 'is_prime' that returns True/False"
    test_cases:
      - input: 7
        expected: True
      - input: 4
        expected: False
      - input: 1
        expected: False
      - input: 2
        expected: True

  - id: flux_03
    description: "Write a function to find the factorial of a number"
    requirements: "function named 'factorial' that returns the factorial"
    test_cases:
      - input: 5
        expected: 120
      - input: 0
        expected: 1
      - input: 3
        expected: 6

  - id: flux_04
    description: "Write a function to check if two strings are anagrams"
    requirements: "function named 'is_anagram' that returns True/False"
    test_cases:
      - input: ["listen", "silent"]
        expected: True
      - input: ["hello", "world"]
        expected: False

  - id: flux_05
    description: "Write a function to find the Fibonacci number at position n"
    requirements: "function named 'fibonacci' that returns the nth fibonacci number"
    test_cases:
      - input: 6
        expected: 8
      - input: 0
        expected: 0
      - input: 1
        expected: 1

# Score = number of passing test cases / total test cases
# val_passrate = passing / 15 (total test cases)